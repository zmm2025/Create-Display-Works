plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.gorylenko.gradle-git-properties' version '4.0.1'
    id 'idea'
    id 'com.diffplug.spotless' version '8.9.0'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

boolean dev = System.getenv("RELEASE") == null || System.getenv("RELEASE") == "false"
String buildNumber = System.getenv("BUILD_NUMBER")

version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")
group = mod_group_id

gitProperties {
    // Keep the embedded metadata useful for identifying a build without including
    // developer or build-machine details in the published jar.
    keys = [
            'git.branch',
            'git.build.version',
            'git.commit.id',
            'git.commit.id.abbrev',
            'git.commit.time',
            'git.dirty'
    ]
    commitIdAbbrevLength = 10
    dateFormat = "yyyy-MM-dd'T'HH:mm:ssXXX"
    dateFormatTimeZone = 'UTC'
    failOnNoGitDirectory = false
}

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

base {
    archivesName = 'create-display-works'
}

String licenseFileName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { licenseFileName }
    }
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    create('dev') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
        }

        server {
            server()
            gameDirectory = file('build/server-run')
            programArgument '--nogui'
        }

        // ./gradlew runGameTestServer runs the GameTests in src/dev on a headless dedicated server, and fails if any do.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // ./gradlew runData regenerates src/generated/resources from the registrations, the hand-written strings in
        // src/main/lang and the Ponder scenes. See "Generated resources" in DEVELOPMENT.md.
        data {
            data()
            gameDirectory = file('build/data-run')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'createdisplayworks.datagen.lang', file('src/main/lang/en_us.json').absolutePath
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Development-only fixtures and tooling; inert unless a dev run enables them, and never part of the jar.
            sourceSet(sourceSets.dev)
        }
    }
}

// Hot-reloading dev client, shared test world and agent control API. See DEVELOPMENT.md.
apply from: 'gradle/dev-client.gradle'
// Screenshots and recordings for PRs, stored outside the repo's branches. See CONTRIBUTING.md.
apply from: 'gradle/pr-evidence.gradle'
// Deletes local branches that are already merged. See DEVELOPMENT.md.
apply from: 'gradle/branch-cleanup.gradle'

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Datagen's record of what it wrote, which only it reads.
    exclude '.cache/**'
}
// Datagen only rewrites the files it generates, so it starts from an empty folder, which leaves no stale files behind.
tasks.matching { it.name == 'runData' }.configureEach {
    def generated = file('src/generated/resources')
    doFirst { generated.deleteDir() }
}
// A quick check, without a data run, for the generated files people most often forget to regenerate: a string added to
// or changed in src/main/lang that isn't in the generated lang file yet, or a file that's both hand-written and
// generated. build and devReload run it. CI also runs runData and fails if that changes anything.
def checkGeneratedResources = tasks.register('checkGeneratedResources') {
    group = 'verification'
    description = 'Checks that src/generated/resources has the strings in src/main/lang and repeats no file in src/main/resources.'
    def langSource = file('src/main/lang/en_us.json')
    def generatedLang = file("src/generated/resources/assets/${mod_id}/lang/en_us.json")
    def mainResources = file('src/main/resources')
    def generatedResources = file('src/generated/resources')
    doLast {
        def problems = []
        if (generatedResources.directory) {
            generatedResources.eachFileRecurse(groovy.io.FileType.FILES) { generated ->
                String path = generatedResources.toPath().relativize(generated.toPath()).toString().replace(File.separator, '/')
                if (!path.startsWith('.cache/') && new File(mainResources, path).exists())
                    problems << "${path} is in both src/main/resources and src/generated/resources. Delete the hand-written copy."
            }
        }
        def generatedStrings = generatedLang.file ? new groovy.json.JsonSlurper().parse(generatedLang, 'UTF-8') : [:]
        new groovy.json.JsonSlurper().parse(langSource, 'UTF-8').each { key, value ->
            if (generatedStrings[key] != value) problems << "\"${key}\" in src/main/lang/en_us.json isn't in the generated lang file yet."
        }
        if (problems) throw new GradleException("Generated resources are out of date. Run ./gradlew runData.\n  " + problems.join('\n  '))
    }
}
tasks.named('check') { dependsOn checkGeneratedResources }

// The yt-dlp and Deno releases YouTube imports use when GitHub's copy of this list can't be fetched. See PUBLISHING.md.
tasks.named('processResources', ProcessResources) { from('media-tools.json') { into 'create_display_works' } }

dependencies {
    implementation jarJar("com.github.weisj:jsvg:2.0.0")
    ['imageio-core','imageio-metadata','imageio-webp'].each { implementation jarJar("com.twelvemonkeys.imageio:${it}:3.15.2") }
    ['common-lang','common-io','common-image'].each { implementation jarJar("com.twelvemonkeys.common:${it}:3.15.2") }
    // Release jars load these through jarJar. Dev runs only see mods, so plain libraries need adding there too.
    additionalRuntimeClasspath "com.github.weisj:jsvg:2.0.0"
    ['imageio-core','imageio-metadata','imageio-webp'].each { additionalRuntimeClasspath "com.twelvemonkeys.imageio:${it}:3.15.2" }
    ['common-lang','common-io','common-image'].each { additionalRuntimeClasspath "com.twelvemonkeys.common:${it}:3.15.2" }
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Minecraft provides the logging API in game; unit tests run without a logging backend, so warnings go nowhere.
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (project.hasProperty('youtubeCheck')) systemProperty 'media.youtubeCheck', 'true'
    if (project.hasProperty('mediaChecks')) systemProperty 'media.formatsCheck', 'true'
}

// Compares main's yt-dlp with the one a media tools PR would give players, on a real video. See PUBLISHING.md.
tasks.register('checkYouTubeTools', Test) {
    description = "Imports a YouTube video with main's media tool list and with an update branch's list, and compares them."
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    // The import code reads the Media Tools setting, which needs NeoForge's config classes.
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.zmm2025.createdisplayworks.media.YouTubeToolsCheck' }
    systemProperty 'youtubeTools.check', 'true'
    // Runs in its own folder, which keeps the tools it downloads and the logs NeoForge writes out of the checkout.
    var checkDir = layout.buildDirectory.dir('youtube-tools-check').get().asFile
    workingDir = checkDir
    systemProperty 'youtubeTools.dir', checkDir.absolutePath
    doFirst { checkDir.mkdirs() }
    systemProperty 'youtubeTools.branch', providers.gradleProperty('branch').getOrElse('chore/media-tools-update')
    systemProperty 'youtubeTools.video', providers.gradleProperty('video').getOrElse('https://www.youtube.com/watch?v=FtutLA63Cp8')
    // YouTube can change at any time, so the result is never up to date.
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Format first when both run, so the compiler sees the formatted sources.
    mustRunAfter 'spotlessApply'
}

// Formatting. `./gradlew build` fails on unformatted code, `./gradlew spotlessApply` fixes it, and devReload runs
// spotlessApply first, so code an agent leaves behind is already formatted.
spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.102.0')
        formatAnnotations()
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
