name: Media tools

# Keeps media-tools.json, the yt-dlp and Deno releases YouTube imports download, up to date. Released mods read that
# file from main, so merging the PR this opens is all it takes to get a new yt-dlp to players. See PUBLISHING.md.
#
# Each day it checks for a new yt-dlp. Deno only changes when you run this by hand with a Deno version, because
# yt-dlp rarely needs a newer one and every Deno update is a 40 MB download for players.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      yt-dlp:
        description: yt-dlp version, or latest
        default: latest
      deno:
        description: Deno version, or latest. Leave empty to keep the current one.
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: media-tools

env:
  BRANCH: chore/media-tools-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Check for new releases
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YT_DLP: ${{ inputs.yt-dlp || 'latest' }}
          DENO: ${{ inputs.deno }}
        run: node .github/scripts/update-media-tools.mjs

      - name: Skip if the open PR already has this list
        id: pending
        if: steps.update.outputs.changed == 'true'
        run: |
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- media-tools.json; then
            echo "The $BRANCH branch already has this list."
            echo "same=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 21
        if: steps.update.outputs.changed == 'true' && steps.pending.outputs.same != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.update.outputs.changed == 'true' && steps.pending.outputs.same != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # PRs opened with this workflow's token don't start the Build workflow, so check here that the mod accepts the list.
      - name: Check that the mod accepts the list
        if: steps.update.outputs.changed == 'true' && steps.pending.outputs.same != 'true'
        run: ./gradlew test --tests 'com.zmm2025.createdisplayworks.media.MediaToolListTest'

      - name: Open or update the PR
        if: steps.update.outputs.changed == 'true' && steps.pending.outputs.same != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.update.outputs.title }}
          YT_DLP: ${{ steps.update.outputs.yt_dlp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add media-tools.json
          git commit --quiet -m "$TITLE"
          git push --force origin "$BRANCH"

          cat > body.md <<EOF
          ## Summary

          Updates [media-tools.json](https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/media-tools.json), the list of
          yt-dlp and Deno releases that YouTube imports download. Released mods read it from \`main\`, so once this is
          merged, players get the new tools on their next YouTube import, within about 6 hours.

          - [yt-dlp $YT_DLP release notes](https://github.com/yt-dlp/yt-dlp/releases/tag/$YT_DLP)
          - Every download was checked against the hash in its release's own checksum file, and the Linux yt-dlp was
            run to confirm its version.
          - \`MediaToolListTest\` passed with this list in the [update run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          ## Testing

          Run \`./gradlew checkYouTubeTools\` before merging. It imports a YouTube video with \`main\`'s yt-dlp and with
          this branch's, on your own connection, and prints whether each works. See PUBLISHING.md.
          EOF

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body-file body.md
          elif ! gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$TITLE" --body-file body.md; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
            echo "::error::Couldn't open the PR. Turn on \"Allow GitHub Actions to create and approve pull requests\" in Settings > Actions > General, or open it yourself: $url"
            echo "Open the PR yourself: $url" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
