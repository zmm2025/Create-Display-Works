name: Build

# Pushes to a pull request's branch build once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build with Gradle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew build

      # A headless dedicated server that runs the GameTests in src/dev and exits non-zero if any fail.
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: create-display-works-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          overwrite: true
