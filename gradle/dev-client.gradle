// Hot-reloading development client. See DEVELOPMENT.md for the workflow.
//
//   ./gradlew runDevClient   launches this checkout's Minecraft (offline "Dev" player) straight into its test world, or
//                            shows it and follows its log if it's already running
//   ./gradlew devReload      compiles, then pushes code, assets and data into the running client
//   ./gradlew devStart       for agents: starts this checkout's Minecraft hidden, in a T3 Code terminal when possible
//   ./gradlew devStop        closes this checkout's Minecraft the way its close button does, and its dedicated server;
//                            T3 Code runs it when a thread settles
//   ./gradlew devRestart     devStop, then devStart
//   ./gradlew devServerStart starts a test dedicated server for this checkout; devServerStop closes it
//
// The in-game side lives in src/dev/java/.../dev/tools; the class-redefinition agent lives in src/devAgent.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.net.http.WebSocket
import java.nio.channels.FileChannel
import java.nio.channels.OverlappingFileLockException
import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.Path
import java.nio.file.SimpleFileVisitor
import java.nio.file.attribute.BasicFileAttributes
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.nio.file.StandardOpenOption
import java.time.Duration
import java.util.concurrent.CompletableFuture
import java.util.concurrent.CompletionStage
import java.util.concurrent.TimeUnit
import java.util.zip.ZipFile

String devWorldName = 'Dev Testing World'
String devControlPort = providers.gradleProperty('devControlPort').getOrElse('25595')
// JetBrains Runtime allows hot-swapping new methods, fields and classes; plain JDKs only allow edits to method bodies.
boolean devUseJbr = providers.gradleProperty('devJbr').getOrElse('true').toBoolean()

// One git call, since it runs on every build: the repository's .git folder, and the branch shown in the game's window
// title so each client says which checkout it runs.
List<String> devGit = providers.exec {
    commandLine 'git', 'rev-parse', '--path-format=absolute', '--git-common-dir', '--abbrev-ref', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.get().readLines()*.trim()
String devCommonDir = devGit[0], devBranch = devGit[1]
// The main checkout's run/ holds the shared game directory and test world. Override with -PdevRunDir=<path> (or in
// ~/.gradle/gradle.properties).
File devMainCheckout = devCommonDir && new File(devCommonDir).name == '.git' ? new File(devCommonDir).parentFile : null
File devRunDir = providers.gradleProperty('devRunDir').map { new File(it) }.getOrElse(devMainCheckout ? new File(devMainCheckout, 'run') : file('run'))
// Each worktree runs its own game in run/worktrees/<worktree>, with its own copy of the test world, so threads don't
// share one game. The main checkout's game uses run/ itself and the fixed control port.
boolean devIsWorktree = devMainCheckout != null && devMainCheckout.canonicalFile != projectDir.canonicalFile
File devInstanceDir = devIsWorktree ? new File(devRunDir, "worktrees/${projectDir.name}") : devRunDir
// Where git commands about worktrees run.
File devRepository = devMainCheckout ?: projectDir
// -PdevHidden starts the window hidden; agents launch this way, through devStart.
boolean devHidden = providers.gradleProperty('devHidden').present
// Images shown in chat. Chat reads them from disk each time it displays them, so this folder outlives the worktree.
ext.devEvidenceDir = new File(devRunDir, "evidence/${devIsWorktree ? projectDir.name : 'main'}").absolutePath
String devLabel = devBranch ? "${devBranch} (${projectDir.name})" : projectDir.name

// Extra mods for the dev client (Jade, EMI, ...) come from a Modrinth App profile, so they can be managed there.
// Set devModsProfile to a profile name or a path to any folder of mod jars.
String devModsProfile = providers.gradleProperty('devModsProfile').getOrElse('Create Display Works Dev')
File devModsSource = {
    File direct = new File(devModsProfile)
    if (direct.isAbsolute()) return direct
    String home = System.getProperty('user.home')
    String appData = providers.environmentVariable('APPDATA').getOrNull()
    List<File> roots = [appData ? new File(appData, 'ModrinthApp') : null,
                        new File(home, 'Library/Application Support/ModrinthApp'),
                        new File(home, '.local/share/ModrinthApp')].findAll { it != null }
    File root = roots.find { it.isDirectory() } ?: roots.first()
    new File(root, "profiles/${devModsProfile}/mods")
}()
// Or a named set of test mods from gradle/dev-mod-sets.json, downloaded once into a cache every worktree shares.
String devModSet = providers.gradleProperty('devModSet').getOrNull()
boolean devModSetRefresh = providers.gradleProperty('devModSetRefresh').present
File devModSetFile = file('gradle/dev-mod-sets.json')
File devModCache = new File(gradle.gradleUserHomeDir, 'create-display-works/dev-mods')
// Mods the Gradle classpath already loads. A second copy from the profile would stop the game with a duplicate-mod error.
Set<String> devClasspathModIds = ['minecraft', 'neoforge', mod_id, 'create', 'ponder', 'flywheel'] as Set

sourceSets {
    // Tiny -javaagent that hands the game an Instrumentation instance for redefining classes.
    create('devAgent')
}

dependencies {
    // The game's module path provides ASM at runtime, so the agent jar doesn't need its own copy.
    devAgentCompileOnly 'org.ow2.asm:asm:9.7.1'
}

def devAgentJar = tasks.register('devAgentJar', Jar) {
    from sourceSets.devAgent.output
    archiveFileName = 'dev-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('devAgent')
    manifest.attributes(
            'Premain-Class': 'com.zmm2025.createdisplayworks.devagent.DevAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
    )
}

// Forward slashes: the run's argument file would otherwise double every Windows backslash.
String devPath(File file) { file.absolutePath.replace('\\', '/') }
String classRoots = (sourceSets.main.output.classesDirs.files + sourceSets.dev.output.classesDirs.files)
        .collect { devPath(it) }.join(File.pathSeparator)
String resourceRoots = [sourceSets.main.output.resourcesDir, sourceSets.dev.output.resourcesDir]
        .collect { devPath(it) }.join(File.pathSeparator)

neoForge.runs {
    devClient {
        client()
        ideName = 'Dev Client (hot reload)'
        gameDirectory = devInstanceDir
        taskBefore devAgentJar
        jvmArguments.add(devAgentJar.flatMap { it.archiveFile }.map { "-javaagent:${it.asFile.absolutePath}".toString() })
        if (devUseJbr) jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        systemProperty 'createdisplayworks.dev.tools', 'true'
        systemProperty 'createdisplayworks.dev.world', devWorldName
        // Port 0 lets a worktree's game pick a free port; it records the port in dev-instance.json.
        systemProperty 'createdisplayworks.dev.controlPort', devIsWorktree ? '0' : devControlPort
        systemProperty 'createdisplayworks.dev.worktreeInstance', devIsWorktree.toString()
        systemProperty 'createdisplayworks.dev.hidden', devHidden.toString()
        programArguments.addAll('--fml.mixinConfig', 'create_display_works_dev.mixins.json')
        systemProperty 'createdisplayworks.dev.worktree', devPath(projectDir)
        systemProperty 'createdisplayworks.dev.label', devLabel
        systemProperty 'createdisplayworks.dev.evidence', devPath(new File(devEvidenceDir))
        systemProperty 'createdisplayworks.dev.classRoots', classRoots
        systemProperty 'createdisplayworks.dev.resourceRoots', resourceRoots
    }
}

tasks.named { it == 'runDevClient' }.configureEach {
    group = 'dev'
    description = "Launches this checkout's Minecraft into '${devWorldName}' with hot reload and the agent control API, or shows it if it's running."
    if (devUseJbr) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
            vendor = JvmVendorSpec.JETBRAINS
        }
    }
    File checkout = projectDir
    // One action, because each doFirst runs before the ones declared above it.
    doFirst {
        DevInstances.removeOrphans(devRunDir, devRepository, it.logger)
        DevClientLauncher.showIfRunning(devInstanceDir, devHidden, it.logger)
        DevInstances.clearScratch(devInstanceDir)
        if (devIsWorktree) DevInstances.prepare(devRunDir, devInstanceDir, checkout, devWorldName, it.logger)
        DevInstances.setLoadingWindow(devInstanceDir, !devHidden)
        List<File> jars = devModSet ? DevModSets.jars(devModSet, devModSetFile, devModCache, devModSetRefresh, it.logger) : DevMods.jars(devModsSource, it.logger)
        DevMods.sync(jars, new File(devInstanceDir, 'mods'), devClasspathModIds, it.logger)
    }
}

// -PdevServer turns the plain server run into the test server devServerStart manages.
File devServerDir = neoForge.runs.server.gameDirectory.get().asFile
boolean devServerRun = providers.gradleProperty('devServer').present
neoForge.runs.server {
    if (devServerRun) {
        systemProperty 'createdisplayworks.dev.serverControl', 'true'
        systemProperty 'createdisplayworks.dev.worktree', devPath(projectDir)
    }
}
tasks.named { it == 'runServer' }.configureEach {
    if (devServerRun) {
        doFirst {
            List<File> jars = devModSet ? DevModSets.jars(devModSet, devModSetFile, devModCache, devModSetRefresh, it.logger) : []
            DevMods.sync(jars, new File(devServerDir, 'mods'), devClasspathModIds, it.logger)
        }
    }
}

/** Resolves named sets of Modrinth projects, with their required dependencies, and keeps their jars in a shared cache. */
class DevModSets {
    static final String API = 'https://api.modrinth.com/v2'
    static final String LOADERS = '["neoforge"]', GAME_VERSIONS = '["1.21.1"]'

    /**
     * The jars of the comma-separated {@code names}. A set's resolved versions are saved beside the jars, so later
     * launches in any worktree need no network. {@code refresh} looks for newer versions.
     */
    static List<File> jars(String names, File definitions, File cache, boolean refresh, Logger logger) {
        Map sets = new JsonSlurper().parse(definitions) as Map
        Map<String, File> jars = [:]
        names.split(',')*.trim().findAll().each { String name ->
            if (!sets.containsKey(name)) throw new GradleException("Unknown mod set '${name}'; ${definitions.name} has ${sets.keySet().join(', ')}.")
            File resolved = new File(cache, "sets/${name}.json")
            if (refresh || !resolved.exists()) {
                logger.lifecycle("Dev mods: resolving set '${name}' on Modrinth")
                resolved.parentFile.mkdirs()
                resolved.text = JsonOutput.prettyPrint(JsonOutput.toJson(resolve(sets[name] as List)))
            }
            (new JsonSlurper().parse(resolved) as List<Map>).each { Map mod -> jars[mod.file as String] = download(mod, cache, logger) }
        }
        logger.lifecycle("Dev mods: ${jars.size()} from set ${names}")
        return jars.values() as List
    }

    /** Each entry is a Modrinth slug, slug@version to pin one, or for a mod that's elsewhere, {maven: <repo>, id: <group:artifact:version>}. */
    private static List<Map> resolve(List entries) {
        Map<String, Map> chosen = [:]
        entries.findAll { it instanceof String }.each { String entry ->
            def (String project, String pin) = entry.tokenize('@') + [null]
            add(project, pin, null, chosen)
        }
        List<Map> mods = chosen.values().collect { Map version ->
            Map file = (version.files as List<Map>).find { it.primary } ?: (version.files as List<Map>).first()
            [project: version.project_id, version: version.version_number, file: file.filename, url: file.url, sha1: (file.hashes as Map).sha1]
        }
        return mods + entries.findAll { it instanceof Map }.collect { maven(it as Map) }
    }

    private static Map maven(Map entry) {
        def (String group, String artifact, String version) = (entry.id as String).tokenize(':')
        String file = "${artifact}-${version}.jar"
        String url = "${entry.maven}/${group.replace('.', '/')}/${artifact}/${version}/${file}"
        HttpResponse<String> sha1 = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build().send(request("${url}.sha1"), HttpResponse.BodyHandlers.ofString())
        if (sha1.statusCode() != 200) throw new GradleException("${entry.maven} answered ${sha1.statusCode()} for ${file}.sha1")
        return [project: artifact, version: version, file: file, url: url, sha1: sha1.body().trim()]
    }

    private static void add(String project, String pin, String versionId, Map<String, Map> chosen) {
        Map version = versionId ? get("/version/${versionId}") as Map : pick(project, pin)
        if (chosen.containsKey(version.project_id)) return
        chosen[version.project_id as String] = version
        (version.dependencies as List<Map>).findAll { it.dependency_type == 'required' }.each { Map dependency ->
            add(dependency.project_id as String, null, dependency.version_id as String, chosen)
        }
    }

    private static Map pick(String project, String pin) {
        String query = "loaders=${URLEncoder.encode(LOADERS, 'UTF-8')}&game_versions=${URLEncoder.encode(GAME_VERSIONS, 'UTF-8')}"
        List<Map> versions = get("/project/${project}/version?${query}") as List<Map>
        Map version = pin ? versions.find { it.version_number == pin } : versions.find { it.version_type == 'release' } ?: versions[0]
        if (version == null) throw new GradleException("Modrinth has no NeoForge 1.21.1 version of ${project}${pin ? " matching ${pin}" : ''}.")
        return version
    }

    private static Object get(String path) {
        HttpResponse<String> response = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build().send(request("${API}${path}"), HttpResponse.BodyHandlers.ofString())
        if (response.statusCode() != 200) throw new GradleException("Modrinth answered ${response.statusCode()} for ${path}")
        return new JsonSlurper().parseText(response.body())
    }

    private static HttpRequest request(String url) {
        return HttpRequest.newBuilder(URI.create(url)).timeout(Duration.ofMinutes(5)).header('User-Agent', 'Create-Display-Works-dev-tools').build()
    }

    private static File download(Map mod, File cache, Logger logger) {
        File jar = new File(cache, "jars/${mod.file}")
        if (jar.exists() && sha1(jar) == mod.sha1) return jar
        logger.lifecycle("Dev mods: downloading ${mod.file}")
        jar.parentFile.mkdirs()
        File partial = File.createTempFile(jar.name, '.part', jar.parentFile)
        try {
            HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build().send(request(mod.url as String), HttpResponse.BodyHandlers.ofFile(partial.toPath()))
            if (sha1(partial) != mod.sha1) throw new GradleException("${mod.file} doesn't match Modrinth's checksum.")
            Files.move(partial.toPath(), jar.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
        } finally {
            partial.delete()
        }
        return jar
    }

    private static String sha1(File file) {
        MessageDigest digest = MessageDigest.getInstance('SHA-1')
        file.eachByte(65536) { byte[] bytes, int length -> digest.update(bytes, 0, length) }
        return digest.digest().encodeHex().toString()
    }
}

class DevMods {
    /** Lists the jars this sync copied last time, so jars added to run/mods by hand are left alone. */
    static final String MANIFEST = '.dev-mods-synced'

    /** The enabled jars of a Modrinth profile or any folder of mods. */
    static List<File> jars(File source, Logger logger) {
        if (!source.isDirectory()) {
            logger.lifecycle("Dev mods: no mods folder at ${source}; create the Modrinth profile or set devModsProfile")
            return []
        }
        // Modrinth disables a mod by renaming it to .jar.disabled, so only .jar files count.
        return source.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') }
    }

    /** Mirrors the jars into a game's mods folder. */
    static void sync(List<File> jars, File modsDir, Set<String> classpathModIds, Logger logger) {
        modsDir.mkdirs()
        File manifest = new File(modsDir, MANIFEST)
        Set<String> previous = manifest.exists() ? manifest.readLines().findAll { it } as Set : [] as Set
        Map<String, File> wanted = [:]
        jars.sort { it.name }.each { File jar ->
            Set<String> ids = modIds(jar)
            Set<String> clash = ids.intersect(classpathModIds)
            if (clash) logger.lifecycle("Dev mods: skipping ${jar.name}; Gradle already provides ${clash.join(', ')}")
            else wanted[jar.name] = jar
        }
        (previous - wanted.keySet()).each { new File(modsDir, it).delete() }
        wanted.each { String name, File jar ->
            File target = new File(modsDir, name)
            if (target.length() != jar.length() || target.lastModified() != jar.lastModified()) {
                java.nio.file.Files.copy(jar.toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
            }
        }
        manifest.text = wanted.keySet().join('\n')
        if (wanted) logger.lifecycle("Dev mods: ${wanted.size()} in ${modsDir}")
    }

    private static Set<String> modIds(File jar) {
        try (ZipFile zip = new ZipFile(jar)) {
            def entry = zip.getEntry('META-INF/neoforge.mods.toml') ?: zip.getEntry('META-INF/mods.toml')
            if (entry == null) return [] as Set
            String toml = zip.getInputStream(entry).getText('UTF-8')
            // Only [[mods]] tables declare mods; [[dependencies.*]] tables also have modId keys.
            Set<String> ids = [] as Set
            boolean inMods = false
            toml.eachLine { String line ->
                String trimmed = line.trim()
                if (trimmed.startsWith('[')) inMods = trimmed ==~ /\[\[\s*mods\s*]]/
                def match = inMods ? trimmed =~ /^modId\s*=\s*["']([^"']+)["']/ : null
                if (match) ids << match[0][1]
            }
            return ids
        } catch (IOException ignored) {
            return [] as Set
        }
    }
}

class DevInstances {
    /** Names the worktree a game folder belongs to, so the folder can be deleted once that worktree is gone. */
    static final String OWNER = 'dev-worktree.txt'
    static final int SCRATCH_DAYS = 2
    /** What a worktree's game copies from the main game folder besides the test world. */
    static final List<String> COPIED = ['options.txt', 'config', 'defaultconfigs', 'emi.json', 'resourcepacks', 'schematics',
                                        'usercache.json', 'usernamecache.json']

    /** Whether a game is running in this folder; the game holds the lock until it exits. */
    static boolean running(File gameDir) {
        File lock = new File(gameDir, 'dev-client.lock')
        if (!lock.exists()) return false
        try (FileChannel channel = FileChannel.open(lock.toPath(), StandardOpenOption.WRITE)) {
            def held = channel.tryLock()
            if (held == null) return true
            held.release()
            return false
        } catch (OverlappingFileLockException | IOException ignored) {
            return true
        }
    }

    /** The control API port and process of the game running in this folder, as the game recorded them. */
    static Map info(File gameDir) {
        File file = new File(gameDir, 'dev-instance.json')
        try {
            return file.exists() ? new JsonSlurper().parse(file) as Map : null
        } catch (Exception ignored) {
            return null
        }
    }

    /** The control API port of the game running in this folder, or null if none is. */
    static Object port(File gameDir) {
        return running(gameDir) ? info(gameDir)?.port : null
    }

    /**
     * Deletes the game folders of worktrees that no longer exist, and what's left of the worktrees themselves: on
     * Windows, removing a worktree stops partway while its game has files in it open. Then has git forget them.
     */
    static void removeOrphans(File runDir, File repository, Logger logger) {
        boolean removed = false
        new File(runDir, 'worktrees').listFiles()?.findAll { it.isDirectory() }?.each { File dir ->
            File owner = new File(dir, OWNER)
            if (!owner.exists()) return
            File worktree = new File(owner.text.trim())
            if (new File(worktree, '.git').exists() || running(dir)) return
            removed = true
            if (worktree.isDirectory() && deleteTree(worktree)) logger.lifecycle("Dev client: finished deleting removed worktree ${worktree}")
            if (deleteTree(dir)) logger.lifecycle("Dev client: deleted the game folder of removed worktree ${worktree.name}")
        }
        if (removed) {
            new ProcessBuilder('git', '-C', repository.absolutePath, 'worktree', 'prune').redirectErrorStream(true)
                    .redirectOutput(ProcessBuilder.Redirect.DISCARD).start().waitFor(1, TimeUnit.MINUTES)
        }
    }

    /**
     * Deletes a folder and everything in it, and returns whether it's gone. A junction or symbolic link inside it is
     * deleted as a link: unlike File.deleteDir, this never deletes what a link points to.
     */
    static boolean deleteTree(File root) {
        Path start = root.toPath()
        if (!Files.exists(start, LinkOption.NOFOLLOW_LINKS)) return true
        Files.walkFileTree(start, new SimpleFileVisitor<Path>() {
            @Override
            FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes attrs) {
                if (!attrs.isOther() && !attrs.isSymbolicLink()) return FileVisitResult.CONTINUE
                try { Files.deleteIfExists(dir) } catch (IOException ignored) {}
                return FileVisitResult.SKIP_SUBTREE
            }

            @Override
            FileVisitResult visitFile(Path file, BasicFileAttributes attrs) {
                try { Files.deleteIfExists(file) } catch (IOException ignored) {}
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult visitFileFailed(Path file, IOException e) {
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult postVisitDirectory(Path dir, IOException e) {
                try { Files.deleteIfExists(dir) } catch (IOException ignored) {}
                return FileVisitResult.CONTINUE
            }
        })
        return !Files.exists(start, LinkOption.NOFOLLOW_LINKS)
    }

    /** Scratch captures in a game's folder only matter during the work that made them. */
    static void clearScratch(File gameDir) {
        long oldest = System.currentTimeMillis() - TimeUnit.DAYS.toMillis(SCRATCH_DAYS)
        new File(gameDir, 'screenshots/dev-tools').listFiles()?.findAll { it.lastModified() < oldest }?.each { File old ->
            deleteTree(old)
        }
    }

    /** Gives a worktree's game copies of the main test world and settings the first time it launches. */
    static void prepare(File runDir, File gameDir, File worktree, String worldName, Logger logger) {
        gameDir.mkdirs()
        new File(gameDir, OWNER).text = worktree.absolutePath
        File world = new File(gameDir, "saves/${worldName}")
        if (world.exists()) return
        def mainPort = port(runDir)
        if (mainPort != null) {
            // Write the main game's unsaved changes to disk first, so the copy has them.
            try {
                DevHttp.call(mainPort, '/save', true)
            } catch (Exception e) {
                logger.lifecycle("Dev client: couldn't save the main game first (${e.message}); copying the world as it is on disk")
            }
        }
        COPIED.each { copy(new File(runDir, it), new File(gameDir, it)) }
        copy(new File(runDir, "saves/${worldName}"), world)
        logger.lifecycle("Dev client: copied '${worldName}' and settings from ${runDir} for this worktree")
    }

    private static void copy(File source, File target) {
        if (!source.exists()) return
        Files.walk(source.toPath()).withCloseable { paths ->
            paths.forEach { path ->
                // session.lock belongs to whichever game has the world open.
                if (path.fileName.toString() == 'session.lock') return
                def destination = target.toPath().resolve(source.toPath().relativize(path).toString())
                if (Files.isDirectory(path)) Files.createDirectories(destination)
                else Files.copy(path, destination, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.COPY_ATTRIBUTES)
            }
        }
    }

    /** NeoForge's loading window shows itself, so a hidden launch turns it off. */
    static void setLoadingWindow(File gameDir, boolean enabled) {
        File config = new File(gameDir, 'config/fml.toml')
        String line = "earlyWindowControl = ${enabled}"
        if (!config.exists()) {
            if (enabled) return
            config.parentFile.mkdirs()
            config.text = line + '\n'
            return
        }
        String text = config.text
        String updated = text =~ /(?m)^earlyWindowControl\s*=.*$/ ? text.replaceFirst(/(?m)^earlyWindowControl\s*=.*$/, line) : line + '\n' + text
        if (updated != text) config.text = updated
    }
}

/** Talks to the control API of this computer's dev clients and test servers. */
class DevHttp {
    /** Sends a request, a POST with an empty body if {@code post}, and returns the JSON answer. */
    static Map call(Object port, String path, boolean post, Duration timeout = Duration.ofSeconds(30)) {
        HttpRequest.Builder request = HttpRequest.newBuilder(URI.create("http://127.0.0.1:${port}${path}")).timeout(timeout)
        if (post) request.POST(HttpRequest.BodyPublishers.noBody())
        HttpResponse<String> response = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(2)).build()
                .send(request.build(), HttpResponse.BodyHandlers.ofString())
        return new JsonSlurper().parseText(response.body()) as Map
    }

    /** What {@code /status} answers, or null if nothing answers, for example while the game is still loading. */
    static Map status(Object port) {
        if (port == null) return null
        try {
            return call(port, '/status', false, Duration.ofSeconds(5))
        } catch (Exception ignored) {
            return null
        }
    }
}

class DevClientLauncher {
    /**
     * Each checkout runs one game. If it's already running, shows its window and follows its log until the game closes,
     * instead of launching another. A hidden launch (an agent's) just leaves it running.
     */
    static void showIfRunning(File gameDir, boolean hidden, Logger logger) {
        if (!DevInstances.running(gameDir)) {
            // Left by a game that has exited; the next game writes a fresh one.
            new File(gameDir, 'dev-instance.json').delete()
            return
        }
        def port = DevInstances.info(gameDir)?.port
        if (hidden) {
            logger.lifecycle("Minecraft is already running for this checkout (control API on port ${port}).")
            throw new StopExecutionException()
        }
        try {
            DevHttp.call(port, '/window?show=true', true)
        } catch (Exception e) {
            logger.lifecycle("Couldn't show the running game's window: ${e.message}")
        }
        logger.lifecycle('Minecraft is already running for this checkout, so its window is shown now. Following its log; ' +
                'stopping this leaves the game running.')
        follow(new File(gameDir, 'logs/latest.log'), gameDir)
        logger.lifecycle('Minecraft has closed.')
        throw new StopExecutionException()
    }

    private static void follow(File log, File gameDir) {
        long position = Math.max(0, log.length() - 4000)
        boolean partialLine = position > 0
        while (DevInstances.running(gameDir)) {
            long length = log.length()
            if (length < position) position = 0
            if (length > position) {
                byte[] bytes = new byte[(int) (length - position)]
                new RandomAccessFile(log, 'r').withCloseable { it.seek(position); it.readFully(bytes) }
                position = length
                String text = new String(bytes, 'UTF-8')
                if (partialLine) {
                    text = text.substring(text.indexOf('\n') + 1)
                    partialLine = false
                }
                System.out.print(text)
                System.out.flush()
            }
            Thread.sleep(250)
        }
    }
}

/** Opens a terminal in a T3 Code thread and runs a command in it, so the user can watch and stop what an agent started. */
class DevT3Terminal {
    /**
     * Makes the terminal's shell exit once the command succeeds, for example when the game is closed normally. T3 Code
     * then closes the terminal; an idle one would still keep T3 from cleaning up the worktree. A failed build or a
     * crash leaves it open to read. T3 Code's terminals run PowerShell on Windows.
     */
    static String closingOnSuccess(String command) {
        return System.getProperty('os.name').toLowerCase().contains('windows')
                ? command + '; if ($LASTEXITCODE -eq 0) { exit }'
                : command + ' && exit'
    }

    /** Quotes arguments for the terminal's shell. PowerShell would split one with a comma, such as two mod sets. */
    static String quoted(List<String> args, boolean windows) {
        return args.collect { String arg -> arg ==~ /[\w.:\/=-]+/ ? arg
                : "'" + (windows ? arg.replace("'", "''") : arg.replace("'", "'\"'\"'")) + "'" }.join(' ')
    }

    static boolean run(String cli, File t3Home, String threadId, String terminalId, File cwd, String command, Logger logger) {
        Map session = null
        try {
            Map runtime = new JsonSlurper().parse(new File(t3Home, 'userdata/server-runtime.json')) as Map
            session = new JsonSlurper().parseText(exec([cli, 'auth', 'session', 'issue', '--scope', 'terminal:operate',
                                                        '--ttl', '5m', '--label', 'Minecraft dev client', '--json'])) as Map
            Map<String, CompletableFuture<Map>> replies = ['0': new CompletableFuture<Map>(), '1': new CompletableFuture<Map>(), '2': new CompletableFuture<Map>()]
            StringBuilder partial = new StringBuilder()
            WebSocket.Listener listener = new WebSocket.Listener() {
                @Override
                CompletionStage<?> onText(WebSocket socket, CharSequence data, boolean last) {
                    partial.append(data)
                    if (last) {
                        Map message = new JsonSlurper().parseText(partial.toString()) as Map
                        partial.setLength(0)
                        if (message._tag == 'Exit') replies[message.requestId as String]?.complete(message.exit as Map)
                    }
                    socket.request(1)
                    return null
                }
            }
            URI uri = URI.create(runtime.origin.toString().replaceFirst('^http', 'ws') + '/ws?orchestrationProtocol=2&clientSurface=cli')
            WebSocket socket = HttpClient.newHttpClient().newWebSocketBuilder().header('Authorization', "Bearer ${session.token}")
                    .buildAsync(uri, listener).get(10, TimeUnit.SECONDS)
            try {
                // Text typed into a terminal whose shell is about to exit, as right after devStop, would be lost.
                try {
                    request(socket, replies, '0', 'terminal.close', [threadId: threadId, terminalId: terminalId])
                } catch (IOException ignored) {
                    // There wasn't one.
                }
                request(socket, replies, '1', 'terminal.open', [threadId: threadId, terminalId: terminalId, cwd: cwd.absolutePath, cols: 120, rows: 30])
                request(socket, replies, '2', 'terminal.write', [threadId: threadId, terminalId: terminalId, data: command + '\r'])
            } finally {
                socket.sendClose(WebSocket.NORMAL_CLOSURE, '')
            }
            return true
        } catch (Exception e) {
            logger.lifecycle("Couldn't open a T3 Code terminal: ${e.message}")
            return false
        } finally {
            if (session?.sessionId) {
                try {
                    exec([cli, 'auth', 'session', 'revoke', session.sessionId.toString()])
                } catch (Exception ignored) {
                    // It expires in 5 minutes anyway.
                }
            }
        }
    }

    private static void request(WebSocket socket, Map<String, CompletableFuture<Map>> replies, String id, String method, Map payload) {
        socket.sendText(JsonOutput.toJson([_tag: 'Request', id: id, tag: method, payload: payload, headers: []]), true).get(10, TimeUnit.SECONDS)
        Map exit = replies[id].get(15, TimeUnit.SECONDS)
        if (exit._tag != 'Success') throw new IOException("${method} failed: ${JsonOutput.toJson(exit)}")
    }

    private static String exec(List<String> command) {
        Process process = new ProcessBuilder(command).start()
        process.outputStream.close()
        CompletableFuture<String> errors = CompletableFuture.supplyAsync { process.errorStream.getText('UTF-8') }
        String output = process.inputStream.getText('UTF-8')
        if (!process.waitFor(60, TimeUnit.SECONDS) || process.exitValue() != 0) {
            throw new IOException("t3 ${command[1..3].join(' ')} failed: ${errors.get().trim()}")
        }
        return output
    }
}

/** Starts a game or server for this checkout with ./gradlew, in a T3 Code thread's terminal when possible. */
abstract class DevLaunchTask extends DefaultTask {
    @Input abstract Property<String> getCheckout()
    @Input @Optional abstract Property<String> getThreadId()
    @Input @Optional abstract Property<String> getT3Cli()
    @Input abstract Property<String> getT3Home()
    @Input @Optional abstract Property<String> getModSet()
    @Input abstract Property<Boolean> getModSetRefresh()

    DevLaunchTask() {
        outputs.upToDateWhen { false }
    }

    /**
     * Runs ./gradlew with {@code args} and the mod set in the thread's {@code terminal} in T3 Code, or without T3 Code
     * in the background, with its output in {@code log}.
     */
    protected void launch(List<String> args, String terminal, File log, String what) {
        boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
        File checkoutDir = new File(checkout.get())
        List<String> command = new ArrayList<>(args)
        if (modSet.present) command << "-PdevModSet=${modSet.get()}".toString()
        if (modSetRefresh.get()) command << '-PdevModSetRefresh'
        if (threadId.present && t3Cli.present && DevT3Terminal.run(t3Cli.get(), new File(t3Home.get()), threadId.get(), terminal,
                checkoutDir, DevT3Terminal.closingOnSuccess("./gradlew ${DevT3Terminal.quoted(command, windows)}".toString()), logger)) {
            logger.lifecycle("Starting ${what} in this thread's '${terminal}' terminal in T3 Code.")
            return
        }
        log.parentFile.mkdirs()
        new ProcessBuilder([new File(checkoutDir, windows ? 'gradlew.bat' : 'gradlew').absolutePath] + command)
                .directory(checkoutDir).redirectErrorStream(true).redirectOutput(ProcessBuilder.Redirect.to(log)).start()
        logger.lifecycle("Starting ${what} in the background; its output goes to ${log}.")
    }

    /**
     * Calls {@code ready} every second until it returns true, for up to 5 minutes. Fails as soon as a crash report
     * from after {@code since} shows up in {@code gameDir}; 0 skips that check.
     */
    protected static void await(File gameDir, long since, String what, Closure<Boolean> ready) {
        long deadline = System.nanoTime() + TimeUnit.MINUTES.toNanos(5)
        while (System.nanoTime() < deadline) {
            File crash = since == 0 ? null : new File(gameDir, 'crash-reports').listFiles()?.find { it.lastModified() >= since }
            if (crash != null) throw new GradleException("${what} crashed while starting; see ${crash}")
            if (ready()) return
            Thread.sleep(1000)
        }
        throw new GradleException("${what} did not start within 5 minutes; check its terminal or log.")
    }
}

abstract class DevStartTask extends DevLaunchTask {
    @Input abstract Property<String> getGameDirectory()
    @Input @Optional abstract Property<String> getModsProfile()

    @TaskAction
    void start() {
        File gameDir = new File(gameDirectory.get())
        long startedAt = System.currentTimeMillis()
        boolean starting = !DevInstances.running(gameDir)
        if (starting) {
            new File(gameDir, 'dev-instance.json').delete()
            // The game's own Gradle run reads devModsProfile, so pass on one given to devStart.
            List<String> args = ['runDevClient', '-PdevHidden']
            if (modsProfile.present) args << "-PdevModsProfile=${modsProfile.get()}".toString()
            launch(args, 'minecraft', new File(gameDir, 'logs/dev-start.log'), 'Minecraft hidden')
        }
        // Wait until the game has joined its world, so the agent can drive it right away. A mod can crash the game
        // moments after it joins, so a new game has to stay up for 5 seconds to count as ready.
        long readySince = 0
        await(gameDir, starting ? startedAt : 0, 'Minecraft') {
            def port = DevInstances.port(gameDir)
            Map status = DevHttp.status(port)
            if (status?.world == null || status.player == null) {
                if (readySince != 0) throw new GradleException('Minecraft reached its world, then stopped answering; check its terminal or logs/latest.log.')
                return false
            }
            if (starting && readySince == 0) readySince = System.currentTimeMillis()
            if (starting && System.currentTimeMillis() - readySince < 5000) return false
            logger.lifecycle("DEV CLIENT READY - control API on http://127.0.0.1:${port} (world '${status.world}', ${status.hidden ? 'hidden' : 'visible'})")
            return true
        }
    }
}

/** Starts this checkout's test dedicated server and waits until it accepts players. */
abstract class DevServerStartTask extends DevLaunchTask {
    private static final String FLAT_WORLD = '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":62},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'

    @Input abstract Property<String> getServerDirectory()

    @TaskAction
    void start() {
        File serverDir = new File(serverDirectory.get())
        File info = new File(checkout.get(), 'build/dev-server.json')
        Map running = DevServers.status(info)
        if (running != null) {
            logger.lifecycle("DEV SERVER READY - already running: join with POST /connect?host=localhost:${running.gamePort}, console API on port ${running.port}")
            return
        }
        info.delete()
        serverDir.mkdirs()
        int gamePort = DevServers.freePort()
        // A disposable test world; the EULA is the same one anyone running this server accepts.
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = ["server-port=${gamePort}", 'online-mode=false', 'enforce-secure-profile=false', 'spawn-protection=0',
                                                         'level-type=minecraft:flat', 'generator-settings=' + FLAT_WORLD, 'generate-structures=false', 'view-distance=6', 'simulation-distance=6', 'gamemode=creative'].join('\n') + '\n'
        long startedAt = System.currentTimeMillis()
        launch(['runServer', '-PdevServer'], 'minecraft-server', new File(serverDir, 'dev-server-start.log'), 'the dedicated server')
        await(serverDir, startedAt, 'The dedicated server') {
            Map status = DevServers.status(info)
            if (status != null) logger.lifecycle("DEV SERVER READY - join with POST /connect?host=localhost:${status.gamePort}, console API on port ${status.port}")
            return status != null
        }
    }
}

class DevServers {
    /**
     * A free port near Minecraft's own. A port from the system's ephemeral range could go to an outgoing connection
     * during the half minute the server takes to start.
     */
    static int freePort() {
        for (int port = 25700; port < 25800; port++) {
            try {
                new ServerSocket(port).close()
                return port
            } catch (IOException ignored) {
                // In use; try the next.
            }
        }
        throw new GradleException('No free port between 25700 and 25800 for the dedicated server.')
    }

    /** What the running server reports, or null if it isn't running. */
    static Map status(File info) {
        try {
            return info.exists() ? DevHttp.status((new JsonSlurper().parse(info) as Map).port) : null
        } catch (Exception ignored) {
            return null // Still being written.
        }
    }

    /** Asks the server to save and close, and waits until it has. Returns whether one was running. */
    static boolean stop(File info, Logger logger) {
        Map status = status(info)
        if (status == null) return false
        DevHttp.call(status.port, '/quit', true)
        long deadline = System.nanoTime() + TimeUnit.MINUTES.toNanos(1)
        while (DevServers.status(info) != null && System.nanoTime() < deadline) Thread.sleep(250)
        info.delete()
        logger.lifecycle('DEV SERVER: STOPPED - the dedicated server saved and closed.')
        return true
    }
}

abstract class DevServerStopTask extends DefaultTask {
    @Input abstract Property<String> getInfoFile()

    DevServerStopTask() {
        outputs.upToDateWhen { false }
    }

    @TaskAction
    void stop() {
        if (!DevServers.stop(new File(infoFile.get()), logger)) logger.lifecycle('DEV SERVER: NOT RUNNING - no dedicated server is running for this checkout.')
    }
}

abstract class DevStopTask extends DefaultTask {
    @Input abstract Property<String> getGameDirectory()
    @Input abstract Property<String> getServerInfoFile()

    DevStopTask() {
        outputs.upToDateWhen { false }
    }

    @TaskAction
    void stop() {
        DevServers.stop(new File(serverInfoFile.get()), logger)
        File gameDir = new File(gameDirectory.get())
        if (!DevInstances.running(gameDir)) {
            logger.lifecycle('DEV STOP: NOT RUNNING - no dev client is running for this checkout.')
            return
        }
        Map info = DevInstances.info(gameDir)
        try {
            DevHttp.call(info?.port, '/quit', true)
            // Saving the world can take a while.
            if (waitForExit(gameDir, 2)) {
                logger.lifecycle('DEV STOP: STOPPED - Minecraft saved and closed.')
                return
            }
            logger.lifecycle("Minecraft didn't close within 2 minutes.")
        } catch (Exception e) {
            logger.lifecycle("Couldn't ask Minecraft to close (${e.message}).")
        }
        ProcessHandle game = info?.pid ? ProcessHandle.of(info.pid as long).orElse(null) : null
        if (game == null) throw new GradleException("DEV STOP: FAILED - Minecraft didn't close, and its process isn't known.")
        logger.lifecycle("Ending Minecraft's process ${info.pid} without saving.")
        game.destroyForcibly()
        if (!waitForExit(gameDir, 1)) throw new GradleException("DEV STOP: FAILED - Minecraft's process ${info.pid} is still running.")
        logger.lifecycle('DEV STOP: KILLED - Minecraft was ended without saving. Its terminal stays open, showing the failed run.')
    }

    private static boolean waitForExit(File gameDir, long minutes) {
        long deadline = System.nanoTime() + TimeUnit.MINUTES.toNanos(minutes)
        while (DevInstances.running(gameDir)) {
            if (System.nanoTime() > deadline) return false
            Thread.sleep(250)
        }
        return true
    }
}

abstract class DevReloadTask extends DefaultTask {
    @Input abstract Property<String> getGameDirectory()
    @Input abstract Property<String> getRunDirectory()
    @Input abstract Property<String> getRepository()
    @Input abstract Property<String> getWorktree()
    @Input abstract Property<Boolean> getFull()

    DevReloadTask() {
        outputs.upToDateWhen { false }
    }

    @TaskAction
    void reload() {
        DevInstances.removeOrphans(new File(runDirectory.get()), new File(repository.get()), logger)
        def port = DevInstances.port(new File(gameDirectory.get()))
        Map result = null
        try {
            String query = "worktree=${URLEncoder.encode(worktree.get(), 'UTF-8')}&full=${full.get()}"
            if (port != null) result = DevHttp.call(port, "/reload?${query}", true, Duration.ofMinutes(3))
        } catch (ConnectException ignored) {
            // It has just closed.
        }
        if (result == null) {
            logger.lifecycle('DEV RELOAD: NO SESSION - no dev client is running for this checkout; start one with ./gradlew runDevClient')
            return
        }
        (result.details as List)?.each { logger.lifecycle("  ${it}") }
        // A hidden game was started by an agent with devStart, or minimized, so the user isn't looking at it, and
        // agents word their closing line differently (see AGENTS.md).
        Map status = DevHttp.status(port)
        String window = status == null ? '[window state unknown]'
                : status.hidden ? '[window hidden: the user is not looking at this game]' : '[window shown]'
        String line = "DEV RELOAD: ${result.status.toString().toUpperCase().replace('-', ' ')} - ${result.message} ${window}"
        if (result.status in ['reloaded', 'no-changes']) logger.lifecycle(line)
        else throw new GradleException(line)
    }
}

tasks.register('devReload', DevReloadTask) {
    group = 'dev'
    description = "Formats, compiles and hot-reloads code, assets and data into this checkout's running dev client. -Pfull reloads everything."
    dependsOn 'spotlessApply', 'classes', 'devClasses'
    gameDirectory = devInstanceDir.absolutePath
    runDirectory = devRunDir.absolutePath
    repository = devRepository.absolutePath
    worktree = projectDir.absolutePath
    full = providers.gradleProperty('full').present
}

tasks.withType(DevLaunchTask).configureEach {
    group = 'dev'
    // Compile first, so build errors show up here instead of in a terminal nobody is watching.
    dependsOn 'classes', 'devClasses'
    checkout = projectDir.absolutePath
    threadId = providers.gradleProperty('threadId')
    modSet = providers.gradleProperty('devModSet')
    modSetRefresh = providers.gradleProperty('devModSetRefresh').present
    t3Cli = providers.environmentVariable('T3CODE_CLI_PATH')
    t3Home = providers.environmentVariable('T3CODE_HOME').orElse(new File(System.getProperty('user.home'), '.t3').absolutePath)
}

tasks.register('devStart', DevStartTask) {
    description = "For agents: starts this checkout's dev client hidden (in a T3 Code terminal with -PthreadId=<id>) and waits until it's in its world."
    gameDirectory = devInstanceDir.absolutePath
    modsProfile = providers.gradleProperty('devModsProfile')
    mustRunAfter 'devStop'
}

tasks.register('devStop', DevStopTask) {
    group = 'dev'
    description = "Closes this checkout's dev client the way its close button does, saving the world, and its dedicated server. T3 Code runs it when a thread settles."
    gameDirectory = devInstanceDir.absolutePath
    serverInfoFile = layout.buildDirectory.file('dev-server.json').get().asFile.absolutePath
}

tasks.register('devRestart') {
    group = 'dev'
    description = "For agents: closes this checkout's dev client and starts it hidden again, for changes that need a restart."
    dependsOn 'devStop', 'devStart'
}

tasks.register('devServerStart', DevServerStartTask) {
    description = "Starts a test dedicated server for this checkout (in a T3 Code terminal with -PthreadId=<id>), for testing as a non-operator player."
    serverDirectory = devServerDir.absolutePath
}

tasks.register('devServerStop', DevServerStopTask) {
    group = 'dev'
    description = "Closes this checkout's test dedicated server, saving its world."
    infoFile = layout.buildDirectory.file('dev-server.json').get().asFile.absolutePath
}
